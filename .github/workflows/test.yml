name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: 端到端冒烟测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 本项目零第三方依赖，不需要 npm install
      - name: 运行 79 项端到端测试
        run: node backend/test/smoke.mjs
