<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>运动场馆易约 · 接口演示</title>
<style>
  :root { --line:#e3e8ef; --brand:#1668dc; --ok:#00a870; --lock:#f0a020; --bad:#d54941; --bg:#f5f7fa; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; background:var(--bg); color:#1f2937; }
  header { background:#fff; border-bottom:1px solid var(--line); padding:12px 20px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; position:sticky; top:0; z-index:5; }
  h1 { font-size:17px; margin:0 12px 0 0; }
  h2 { font-size:15px; margin:22px 0 10px; }
  main { padding:16px 20px 60px; max-width:1180px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:#fff; border-radius:7px; padding:6px 12px; }
  button.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
  button.ghost { color:var(--brand); border-color:#bcd4f6; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  input, select { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:7px; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; }
  .muted { color:#6b7280; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .venues { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
  .venue { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px; cursor:pointer; }
  .venue:hover { border-color:var(--brand); }
  .venue b { display:block; margin-bottom:4px; }
  .tag { border-radius:20px; padding:1px 8px; font-size:12px; background:#eef4ff; color:var(--brand); }
  .grid { overflow:auto; }
  .slot { border:1px solid var(--line); border-radius:6px; padding:5px 4px; font-size:12px; text-align:center; min-width:74px; }
  .slot.available { background:#fff; cursor:pointer; }
  .slot.available:hover { border-color:var(--brand); }
  .slot.locked { background:#fff7e6; color:#ad6800; cursor:not-allowed; }
  .slot.booked { background:#f3f4f6; color:#9ca3af; cursor:not-allowed; }
  .slot.maintenance { background:#fff1f0; color:var(--bad); cursor:not-allowed; }
  .slot.closed { background:#f3f4f6; color:#6b7280; cursor:not-allowed; }
  .slot.picked { background:var(--brand); border-color:var(--brand); color:#fff; }
  .pill { display:inline-block; border-radius:20px; padding:1px 9px; font-size:12px; }
  .pill.confirmed { background:#e6fffb; color:var(--ok); }
  .pill.cancelled, .pill.completed { background:#f3f4f6; color:#6b7280; }
  .banner { padding:8px 12px; border-radius:8px; margin:8px 0; display:none; }
  .banner.show { display:block; }
  .banner.err { background:#fff1f0; color:var(--bad); }
  .banner.info { background:#eef4ff; color:var(--brand); }
</style>
</head>
<body>
<header>
  <h1>🏸 运动场馆易约 · 接口演示</h1>
  <span id="who" class="muted">未登录</span>
  <input id="account" placeholder="手机号 / 邮箱" style="width:170px" value="13800000000" />
  <input id="password" type="password" placeholder="密码" style="width:120px" value="demo123456" />
  <button class="primary" onclick="login()">登录</button>
  <button class="ghost" onclick="quickRegister()">注册体验账号</button>
  <button class="ghost" onclick="logout()">退出</button>
</header>

<main>
  <div id="banner" class="banner"></div>

  <section class="card">
    <div class="row">
      <select id="sport"><option value="">全部运动类型</option></select>
      <input type="date" id="date" />
      <button class="ghost" onclick="loadVenues()">刷新场馆</button>
      <label class="muted"><input type="checkbox" id="live" checked /> 实时刷新（SSE）</label>
    </div>
  </section>

  <h2>① 场馆实时状态</h2>
  <div id="venues" class="venues"></div>

  <div id="detail" style="display:none">
    <h2>② 场地时段轴（点击选择起止时段 → 锁定 10 分钟）</h2>
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div><b id="venueName"></b> <span class="muted" id="venueMeta"></span></div>
        <div class="row">
          <span id="pickedInfo" class="muted">未选择时段</span>
          <button class="primary" id="lockBtn" onclick="lock()" disabled>立即锁定</button>
        </div>
      </div>
      <div id="lockInfo" class="banner info"></div>
      <div id="grid" class="grid"></div>
    </div>
  </div>

  <h2>③ 我的预约</h2>
  <div class="card"><table id="mine"><tbody></tbody></table></div>

  <div id="adminBox" style="display:none">
    <h2>④ 场馆后台（管理员）</h2>
    <div class="card">
      <div class="row">
        <select id="adminVenue"></select>
        <button class="ghost" onclick="loadReport()">查看未来 7 天报表</button>
        <span class="muted">利用率 / 预约量 / 营收</span>
      </div>
      <div id="report" style="margin-top:10px"></div>
    </div>
  </div>
</main>

<script>
const state = { token: localStorage.getItem('token') || '', user: null, venueId: null, venue: null, day: '', picked: null, lock: null, timer: null };
const $ = (id) => document.getElementById(id);
const todayStr = () => new Date().toLocaleDateString('sv-SE');

function banner(text, kind = 'info') {
  const el = $('banner');
  el.className = `banner show ${kind}`;
  el.textContent = text;
  if (kind === 'info') setTimeout(() => el.className = 'banner', 4000);
}

async function api(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: { 'Content-Type': 'application/json', ...(state.token ? { Authorization: `Bearer ${state.token}` } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => null);
  if (!res.ok) {
    const err = new Error(data?.error?.message || `请求失败 ${res.status}`);
    err.payload = data?.error;
    throw err;
  }
  return data;
}

async function login() {
  try {
    const out = await api('POST', '/api/auth/login', { account: $('account').value, password: $('password').value });
    state.token = out.token;
    localStorage.setItem('token', out.token);
    banner(`欢迎，${out.user.name}（${out.user.role === 'admin' ? '管理员' : '用户'}）`);
    await boot();
  } catch (e) { banner(e.message, 'err'); }
}

async function quickRegister() {
  const phone = '1' + Math.floor(3e9 + Math.random() * 6e9);
  $('account').value = phone;
  try {
    await api('POST', '/api/auth/register', { name: '体验用户', phone, password: 'test123456' });
    banner(`已创建体验账号 ${phone} / test123456`);
    await login();
  } catch (e) { banner(e.message, 'err'); }
}

function logout() {
  state.token = ''; state.user = null;
  localStorage.removeItem('token');
  $('who').textContent = '未登录';
  $('adminBox').style.display = 'none';
  banner('已退出登录');
}

async function boot() {
  if (state.token) {
    try {
      state.user = await api('GET', '/api/me');
      $('who').textContent = `${state.user.name} · 积分 ${state.user.points} · ${state.user.role}`;
      $('adminBox').style.display = state.user.role === 'admin' ? 'block' : 'none';
    } catch { logout(); }
  }
  await loadVenues();
  await loadMine();
}

async function loadVenues() {
  state.day = $('date').value || todayStr();
  if (es) { es.close(); es = null; }        // 日期变化后重新订阅实时推送
  const rows = await api('GET', `/api/venues?date=${state.day}&sport=${encodeURIComponent($('sport').value)}`);
  $('venues').innerHTML = rows.map((v) => `
    <div class="venue" onclick="openVenue(${v.id})">
      <b>${v.name}</b>
      <div class="muted">${v.sport} · ${v.address}</div>
      <div class="row" style="margin-top:8px">
        <span class="tag">${v.status === 'open' ? '开放中' : '暂停营业'}</span>
        <span class="muted">${v.courtCount} 片场地 · 可约 ${v.availableSlots}/${v.totalSlots} 段 · 占用率 ${(v.utilization * 100).toFixed(0)}%</span>
      </div>
    </div>`).join('') || '<p class="muted">没有符合条件的场馆</p>';
  if (state.venueId && $('live').checked) subscribe();
}

async function openVenue(id) {
  state.venueId = id;
  state.picked = null;
  const detail = await api('GET', `/api/venues/${id}?date=${state.day}`);
  state.venue = detail;
  $('detail').style.display = 'block';
  $('venueName').textContent = detail.name;
  $('venueMeta').textContent = `${detail.sport} · ${detail.openTime}-${detail.closeTime} · 每段 ${detail.slotMinutes} 分钟`;
  renderGrid(detail);
  if (state.user?.role === 'admin') {
    $('adminVenue').innerHTML = detail.courts.map((c) => `<option value="${c.id}">${c.name}（¥${c.pricePerHour}/小时）</option>`).join('');
  }
  subscribe();
}

function renderGrid(detail) {
  const head = detail.slots[0]?.slots.map((s) => `<th>${s.startTime}</th>`).join('') || '';
  const body = detail.slots.map((c) => `
    <tr><td><b>${c.courtName}</b></td>
    ${c.slots.map((s) => {
      const picked = state.picked && state.picked.courtId === c.courtId && s.startMin >= state.picked.startMin && s.endMin <= state.picked.endMin;
      const cls = picked ? 'picked' : s.status;
      return `<td><div class="slot ${cls}" data-court="${c.courtId}" data-start="${s.startMin}" data-end="${s.endMin}" data-status="${s.status}"
        onclick="pickSlot(this)">${s.status === 'available' ? `¥${s.price}` : label(s.status)}</div></td>`;
    }).join('')}
    </tr>`).join('');
  $('grid').innerHTML = `<table><thead><tr><th>场地 \\ 时间</th>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

const label = (s) => ({ locked: '锁定中', booked: '已预约', maintenance: '维护中', closed: '已关闭', available: '可约' }[s] || s);

async function pickSlot(el) {
  if (el.dataset.status !== 'available') return banner(`该时段${label(el.dataset.status)}，请选择其他时段`, 'err');
  const courtId = Number(el.dataset.court);
  const start = Number(el.dataset.start);
  const end = Number(el.dataset.end);
  if (!state.picked || state.picked.courtId !== courtId || start < state.picked.startMin) {
    state.picked = { courtId, startMin: start, endMin: end };
  } else if (start === state.picked.endMin) {
    state.picked.endMin = end;
  } else {
    state.picked = { courtId, startMin: start, endMin: end };
  }
  renderGrid(state.venue);
  const { startMin, endMin } = state.picked;
  $('pickedInfo').textContent = `${fmt(startMin)} - ${fmt(endMin)}（${(endMin - startMin) / 60} 小时）`;
  $('lockBtn').disabled = !state.token;
  if (!state.token) banner('请先登录再锁定时段');
}

const fmt = (min) => `${String(Math.floor(min / 60)).padStart(2, '0')}:${String(min % 60).padStart(2, '0')}`;

async function lock() {
  try {
    const out = await api('POST', '/api/bookings/lock', {
      courtId: state.picked.courtId,
      date: state.day,
      startTime: fmt(state.picked.startMin),
      endTime: fmt(state.picked.endMin),
    });
    state.lock = out;
    let left = out.remainSeconds;
    clearInterval(state.timer);
    const tick = () => {
      const el = $('lockInfo');
      if (!state.lock) return clearInterval(state.timer);
      el.className = 'banner info show';
      el.innerHTML = `已为你锁定 ${out.courtName} ${fmt(state.picked.startMin)}-${fmt(state.picked.endMin)}，${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')} 内完成支付 ·
        <button class="primary" onclick="confirmBooking()">确认预约（模拟支付 ¥${out.amount}）</button>
        <button class="ghost" onclick="giveUp()">放弃</button>`;
      if (left-- <= 0) giveUp();
    };
    tick();
    state.timer = setInterval(tick, 1000);
    await openVenue(state.venueId);
  } catch (e) {
    const tips = (e.payload?.suggestions || []).map((s) => `${s.courtName} ${s.startTime}-${s.endTime}`).join('，');
    banner(`${e.message}${tips ? `｜推荐：${tips}` : ''}`, 'err');
    await openVenue(state.venueId);
  }
}

function giveUp() {
  clearInterval(state.timer);
  state.lock = null;
  $('lockInfo').className = 'banner';
  if (state.venue) openVenue(state.venueId);
}

async function confirmBooking() {
  try {
    const booking = await api('POST', '/api/bookings', { lockId: state.lock.lockId });
    clearInterval(state.timer);
    state.lock = null;
    $('lockInfo').className = 'banner';
    banner(`预约成功！凭证号 ${booking.code}（二维码凭证已生成，可在"我的预约"查看）`);
    state.picked = null;
    $('pickedInfo').textContent = '未选择时段';
    $('lockBtn').disabled = true;
    await loadMine();
    await openVenue(state.venueId);
  } catch (e) { banner(e.message, 'err'); }
}

async function loadMine() {
  if (!state.token) { $('mine').innerHTML = '<tbody><tr><td class="muted">登录后可查看预约记录</td></tr></tbody>'; return; }
  const rows = await api('GET', '/api/bookings/mine');
  $('mine').innerHTML = `<thead><tr><th>场馆/场地</th><th>时间</th><th>金额</th><th>凭证</th><th>状态</th><th></th></tr></thead><tbody>${
    rows.map((b) => `<tr>
      <td>${b.venueName}<br /><span class="muted">${b.courtName}</span></td>
      <td>${b.date} ${b.startTime}-${b.endTime}</td>
      <td>¥${b.amount}</td>
      <td class="muted" style="font-size:12px">${b.code}</td>
      <td><span class="pill ${b.status}">${({ confirmed: '已预约', cancelled: '已取消', completed: '已完成' })[b.status] || b.status}</span></td>
      <td>${b.status === 'confirmed' ? `<button class="ghost" onclick="cancelBooking(${b.id})">取消</button>` : ''}</td>
    </tr>`).join('') || '<tr><td class="muted">暂无预约</td></tr>'
  }</tbody>`;
}

async function cancelBooking(id) {
  try {
    await api('POST', `/api/bookings/${id}/cancel`, { reason: '计划有变' });
    banner('已取消预约，费用原路退回');
    await loadMine();
    if (state.venueId) await openVenue(state.venueId);
  } catch (e) { banner(e.message, 'err'); }
}

async function loadReport() {
  const out = await api('GET', '/api/admin/report?days=7');
  $('report').innerHTML = `<table><thead><tr><th>场馆</th><th>场地</th><th>7 天预约</th><th>利用率</th><th>营收</th></tr></thead><tbody>${
    out.venues.map((v) => `<tr><td>${v.venueName}</td><td>${v.courtCount}</td><td>${v.bookings}</td><td>${(v.utilization * 100).toFixed(1)}%</td><td>¥${v.revenue}</td></tr>`).join('')
  }<tr><td colspan="2"><b>合计</b></td><td><b>${out.totalBookings}</b></td><td>-</td><td><b>¥${out.totalRevenue}</b></td></tr></tbody></table>`;
}

let es = null;
function subscribe() {
  if (!$('live').checked || es) return;
  es = new EventSource(`/api/stream?date=${state.day}`);
  const refresh = () => { if (state.venueId) openVenue(state.venueId); };
  es.addEventListener('booking.created', refresh);
  es.addEventListener('booking.cancelled', refresh);
  es.addEventListener('slot.locked', refresh);
  es.addEventListener('slot.released', refresh);
  es.addEventListener('venue.updated', refresh);
}

$('live').addEventListener('change', (e) => {
  if (e.target.checked) subscribe();
  else { es?.close(); es = null; }
});
$('date').value = todayStr();
$('date').addEventListener('change', loadVenues);
$('sport').addEventListener('change', loadVenues);

(async () => {
  for (const s of await api('GET', '/api/sports')) {
    $('sport').insertAdjacentHTML('beforeend', `<option value="${s}">${s}</option>`);
  }
  await boot();
})();
</script>
</body>
</html>
